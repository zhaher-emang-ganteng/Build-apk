name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout (skrip heal)
        uses: actions/checkout@v4

      - name: Download & extract ZIP
        run: |
          set -e
          echo "=== Download ZIP ==="
          curl -sSL --retry 3 \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" -o project.zip
          ls -lh project.zip
          if ! unzip -tq project.zip > /dev/null 2>&1; then
            echo "❌ File bukan ZIP valid!"
            head -c 600 project.zip
            exit 1
          fi
          rm -rf project_raw
          unzip -q project.zip -d project_raw
          rm -rf project_raw/__MACOSX

          # cari pubspec.yaml milik APLIKASI (yang punya sdk: flutter), bukan paket/contoh
          PUBSPEC=""
          for f in $(find project_raw -maxdepth 5 -name pubspec.yaml \
              -not -path '*/.*' -not -path '*/example/*' -not -path '*/build/*' \
              | awk '{print length, $0}' | sort -n | cut -d' ' -f2-); do
            if grep -Eq "sdk:[[:space:]]*flutter" "$f"; then PUBSPEC="$f"; break; fi
            [ -z "$PUBSPEC" ] && FIRST="$f"
          done
          [ -z "$PUBSPEC" ] && PUBSPEC="${FIRST:-}"

          if [ -n "$PUBSPEC" ]; then
            echo "IS_FLUTTER=true" >> "$GITHUB_ENV"
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/$(dirname "$PUBSPEC")" >> "$GITHUB_ENV"
            echo "✅ Project Flutter: $(dirname "$PUBSPEC")"
          else
            GR=$(find project_raw -maxdepth 5 -name gradlew | head -n 1)
            if [ -z "$GR" ]; then
              echo "❌ pubspec.yaml / gradlew tidak ditemukan di dalam ZIP"
              find project_raw -maxdepth 3 | head -50
              exit 1
            fi
            echo "IS_FLUTTER=false" >> "$GITHUB_ENV"
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/$(dirname "$GR")" >> "$GITHUB_ENV"
            echo "✅ Project Gradle/Android: $(dirname "$GR")"
          fi

      - name: Detect versi Flutter
        id: detect
        if: env.IS_FLUTTER == 'true'
        run: |
          FV=$(python3 -I .github/scripts/heal_flutter.py detect-flutter "$PROJECT_DIR")
          echo "Flutter dipilih: '${FV:-stable terbaru}'"
          echo "flutter=$FV" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        if: env.IS_FLUTTER == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.detect.outputs.flutter }}
          channel: stable
          cache: true

      - name: Heal project (android, icon, asset, dll)
        if: env.IS_FLUTTER == 'true'
        run: python3 -I .github/scripts/heal_flutter.py heal "$PROJECT_DIR"

      - name: Detect versi Java
        id: java
        run: echo "v=$(python3 -I .github/scripts/heal_flutter.py detect-java "$PROJECT_DIR")" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.v }}

      - name: Heal signing
        if: env.IS_FLUTTER == 'true'
        run: python3 -I .github/scripts/heal_flutter.py heal-late "$PROJECT_DIR"

      - name: Analyze Project Code
        if: env.IS_FLUTTER == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get > /dev/null 2>&1 || true
          flutter analyze > analyze_report.txt 2>&1 || true
          echo "[RESULT_ANALYZE]"
          cat analyze_report.txt
          echo "[END_RESULT_ANALYZE]"
          rm -f analyze_report.txt

      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: exit 1

      - name: Get dependencies
        if: env.IS_FLUTTER == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get || { echo "⚠️ pub get gagal, ulangi tanpa pubspec.lock"; rm -f pubspec.lock; flutter pub get; }

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          MODE="${{ github.event.inputs.build_type }}"
          if [ "$IS_FLUTTER" = "true" ]; then
            FLAGS=""
            [ "$MODE" = "release" ] && FLAGS="--no-tree-shake-icons"
            if flutter build apk -h 2>/dev/null | grep -q -- "--android-skip-build-dependency-validation"; then
              FLAGS="$FLAGS --android-skip-build-dependency-validation"
            fi
            flutter build apk --$MODE $FLAGS --no-pub
          else
            chmod +x gradlew
            if [ "$MODE" = "debug" ]; then ./gradlew assembleDebug; else ./gradlew assembleRelease; fi
          fi

      - name: Kumpulkan APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk_out"
          APK=$(find "$PROJECT_DIR" -path '*/build/*' -name '*.apk' ! -name '*unaligned*' -printf '%s %p\n' | sort -rn | head -n 1 | cut -d' ' -f2-)
          if [ -z "$APK" ]; then echo "❌ File .apk tidak ditemukan setelah build"; exit 1; fi
          cp "$APK" "$GITHUB_WORKSPACE/apk_out/"
          ls -lh "$GITHUB_WORKSPACE/apk_out/"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: apk_out/*.apk
          retention-days: 1
          if-no-files-found: error
